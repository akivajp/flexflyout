ShortDescription: Media flyout for Windows 11 with cover art, playback controls and volume, sized and placed where you want.
Description: |-
  FlexFlyout pops up when the volume changes, a media key is pressed or a new track starts, with the cover art, title and artist, the position in the track, the playback controls (with shuffle and repeat) and the volume. It works with any player in the Windows media controls (Spotify, browsers, Media Player).
  The size, the monitor, the position, the display time and the opacity are adjustable, the Windows volume indicator can be avoided or hidden, and the flyout can be pinned and dragged anywhere. Run `flexflyout` once; its tray icon can make it start with Windows.
