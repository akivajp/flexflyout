name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each builds and tests its own host (Windows: eframe; Linux:
        # layer-shell) along with the shared crates.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  linux-binary:
    name: Linux binary
    needs: test
    # The oldest supported Ubuntu, so that the binary runs on glibc 2.35+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p flexflyout
      - uses: actions/upload-artifact@v7
        with:
          name: flexflyout-linux-x86_64
          path: target/release/flexflyout
          retention-days: 30

  windows-binary:
    name: Windows binary
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p flexflyout
      - uses: actions/upload-artifact@v7
        with:
          name: flexflyout-windows-x86_64
          path: target/release/flexflyout.exe
          retention-days: 30
