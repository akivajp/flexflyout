name: Release

# Pushing a tag such as v0.1.0 builds the Windows and Linux binaries
# (x86-64 and ARM64) and publishes a GitHub Release with notes from
# CHANGELOG.md, the archives and their checksums.
#
# Running the workflow by hand only builds the archives (uploaded as
# artifacts), to check the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # On Windows, where the resource compiler embeds the icon and the
        # version information (build.rs); each architecture on its own
        # kind of machine.
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64, runner: windows-latest }
          - { target: aarch64-pc-windows-msvc, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p flexflyout
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="flexflyout-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/flexflyout.exe "dist/$name/"
          cp README.md README.ja.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          7z a -tzip "$name.zip" "$name" > /dev/null
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: flexflyout-${{ matrix.target }}
          path: dist/*
          retention-days: 30
      # The MSIX package for the Microsoft Store (uploaded to Partner Center
      # by hand), and a copy signed with a throwaway certificate for trying
      # it on a test PC. Not part of the GitHub release: an unsigned package
      # cannot be installed. The identity comes from the repository's
      # variables (Partner Center > Product identity) once there is one.
      - name: MSIX package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $params = @{ Exe = "target/release/flexflyout.exe"; Version = $version; OutDir = "msix"; Arch = "${{ matrix.arch }}"; TestSign = $true }
          if ($env:MSIX_IDENTITY_NAME) { $params.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $params.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $params.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./packaging/msix/build.ps1 @params
          Get-ChildItem msix
      # The checks Partner Center runs on a submission, run here first
      # (installs the test copy). The report is kept with the package.
      - name: Windows App Certification Kit
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Host "the App Certification Kit is not installed"; exit 0 }
          $cer = Get-ChildItem msix/*-test.cer | Select-Object -First 1
          $test = Get-ChildItem msix/*-test.msix | Select-Object -First 1
          Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $appcert reset
          $wack = "msix/wack-report-${{ matrix.arch }}.xml"
          & $appcert test -appxpackagepath $test.FullName -reportoutputpath (Join-Path $PWD $wack)
          Write-Host "appcert exit code: $LASTEXITCODE"
          if (Test-Path $wack) {
            [xml] $report = Get-Content -Raw $wack
            Write-Host "Overall: $($report.REPORT.OVERALL_RESULT)"
            $report.SelectNodes("//TEST[RESULT!='PASS']") | ForEach-Object {
              Write-Host "$($_.RESULT): $($_.NAME)"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: flexflyout-msix-${{ matrix.arch }}
          path: msix/*
          retention-days: 30

  # One artifact with the MSIX packages of both architectures, for the
  # Microsoft Store submission.
  msix:
    name: MSIX packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: flexflyout-msix
          pattern: flexflyout-msix-*
          delete-merged: true
          retention-days: 30

  build-linux:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so that the binary runs on glibc 2.35+.
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p flexflyout
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="flexflyout-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/flexflyout "dist/$name/"
          cp packaging/linux/flexflyout.desktop crates/flexflyout/assets/flexflyout.png crates/flexflyout/assets/flexflyout.svg "dist/$name/"
          cp README.md README.ja.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: flexflyout-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  # A new Microsoft Store submission with this version's MSIX packages
  # (x64 and ARM64) and the listing files (packaging/msix/store), through akivajp/msstore-submit
  # (GitHub OIDC; the environment `msstore` is what Entra ID trusts). Left
  # as a draft: its log shows what changes, and the Microsoft Store
  # workflow's commit command submits it (Partner Center shows the changes
  # only once committed; don't edit or submit it there). Tags only.
  store:
    name: Microsoft Store submission
    needs: msix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: akivajp/msstore-submit/.github/workflows/store.yml@main
    with:
      app-id: 9P6KDQX7JZS4
      command: submit
      artifact: flexflyout-msix
      # The Store's packages (-x64.msix and -arm64.msix), not the test
      # copies (-x64-test.msix, -arm64-test.msix).
      package: flexflyout-v*64.msix
      package-count: 2
      listings: packaging/msix/store
      commit: false

  release:
    name: Publish release
    needs: [build, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the crate version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # The archives only (flexflyout-x86_64-..., flexflyout-aarch64-...),
          # not the MSIX packages (flexflyout-msix), which are for the Store.
          pattern: flexflyout-*64-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of this version, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # Download pages must point at the code signing policy (SignPath).
          printf '\n[Code signing policy](%s/%s#code-signing-policy)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "FlexFlyout $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
