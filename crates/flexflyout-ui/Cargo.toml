[package]
name = "flexflyout-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Drawing of the FlexFlyout panel with egui, shared by every host"
publish = false

# egui (and log) only: no OS API and no windowing, so that the Windows host
# (eframe) and the Linux host (smithay-client-toolkit) can both use it.
[dependencies]
egui = "0.37"
# Which fonts were found for which characters, for the hosts' logs.
log = "0.4"
# The font reader egui itself uses (same version), for the fonts' metrics.
skrifa = "0.44"
flexflyout-core = { path = "../flexflyout-core" }

[dev-dependencies]
# The tests draw text, so they need fonts; the hosts bring their own.
egui = { version = "0.37", features = ["default_fonts"] }
egui_kittest = "0.37"
