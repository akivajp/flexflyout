[package]
name = "flexflyout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A flexible media flyout: cover art, title, playback controls and volume, sized and placed where you want"
readme = "../../README.md"
keywords = ["flyout", "osd", "media", "volume", "egui"]
categories = ["gui"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flexflyout-core = { path = "../flexflyout-core" }
flexflyout-ui = { path = "../flexflyout-ui" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
log = "0.4.35"
rust-embed = "8.13"
simplelog = "0.12.2"

# The Windows host. Other platforms get their own hosts later (KDE through
# layer-shell, which winit and therefore eframe do not support).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
raw-window-handle = "0.6.2"
# The same winit as eframe's, for Windows-only window settings that egui
# does not expose (the drop shadow of undecorated windows).
winit = { version = "0.30.13", default-features = false }
# The COM classes made with `#[implement]` refer to windows-core by name.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds the icon and the version information in the executable. Only when
# building on Windows, where the resource compiler is (CI and releases);
# cross builds from Linux go without them.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
