[package]
name = "flexflyout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A flexible media flyout: cover art, title, playback controls and volume, sized and placed where you want"
readme = "../../README.md"
keywords = ["flyout", "osd", "media", "volume", "egui"]
categories = ["gui"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flexflyout-core = { path = "../flexflyout-core" }
flexflyout-ui = { path = "../flexflyout-ui" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
log = "0.4.35"
rust-embed = "8.13"
simplelog = "0.12.2"

# Both hosts: fonts for the characters the flyout's own fonts lack (Korean
# or Chinese titles, say), found through the system's font fallback
# (DirectWrite, fontconfig) when they are first needed, and memory-mapped.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
egui_system_font_provider = "0.37"

# The Windows host. The Linux host has its own below (layer-shell, which
# winit and therefore eframe do not support).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
raw-window-handle = "0.6.2"
# The same winit as eframe's, for Windows-only window settings that egui
# does not expose (the drop shadow of undecorated windows).
winit = { version = "0.30.13", default-features = false }
# The COM classes made with `#[implement]` refer to windows-core by name.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The Linux host (Wayland, layer-shell): smithay-client-toolkit for the
# compositor, egui-wgpu for drawing. Everything is pure Rust or opened at
# run time, so no development packages are needed to build.
[target.'cfg(target_os = "linux")'.dependencies]
# Closing as Quit does when the session ends (SIGTERM at logout), so that
# Plasma's volume popup comes back. Both come with zbus already.
async-signal = "0.2"
futures-lite = "2"
egui = "0.37"
# The settings window is a normal window, which winit can make.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui-wgpu = "0.37"
# The tray icon (StatusNotifierItem), on the same zbus as MPRIS.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Cover art from players' files or the web addresses they give (Spotify).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pollster = "0.4"
# The sound server's own protocol (PulseAudio, and PipeWire through it).
pulseaudio = "0.3"
raw-window-handle = "0.6.2"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
# libwayland is opened at run time (wgpu needs its C objects).
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# KDE Plasma's order of the outputs, to find the primary one (winit uses
# the same crate).
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
ureq = "3"
# MPRIS, the players' D-Bus interface.
zbus = "5"

# Embeds the icon and the version information in the executable. Only when
# building on Windows, where the resource compiler is (CI and releases);
# cross builds from Linux go without them.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
