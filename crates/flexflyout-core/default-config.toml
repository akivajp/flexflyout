# FlexFlyout settings.
#
# Changes take effect within a second of saving this file. Every key is
# optional: delete one to get its default back, or delete the whole file to
# get this commented version again on the next start.

[general]
# Language of the texts: "auto" (the system's), "en" or "ja".
language = "auto"

# What to do with the Windows volume indicator:
#   "avoid" - leave it, and move the flyout out of its way if they overlap
#   "hide"  - hide it. Windows uses the same window for the brightness,
#             airplane mode and similar indicators, which are hidden too.
#             It comes back when FlexFlyout quits (or at its next start, if
#             it was ended from the Task Manager).
#   "keep"  - leave it and ignore it (the two may overlap)
native_osd = "avoid"

# Also show the flyout when the player starts or pauses, from the player's
# own window or from the buttons of Bluetooth headphones (a new track, a
# volume change and the media keys always show it).
show_on_play_pause = true

[display]
# Monitor to show the flyout on: "primary", "cursor" (the one the mouse
# pointer is on) or a number from 1. A missing number means the primary one.
monitor = "primary"

# Where on the monitor (the area without the taskbar):
#   "top-left"     "top"     "top-right"
#   "left"         "center"  "right"
#   "bottom-left"  "bottom"  "bottom-right"
anchor = "top-right"

# Distance from that point in pixels. Next to an edge it is measured inwards
# from the edge; along a centered axis, positive moves right or down.
offset_x = 24
offset_y = 24

# Size relative to the normal size, from 0.25 to 4.0 (on top of the Windows
# display scaling).
scale = 1.0

# Opacity of the panel's background, from 0.0 (invisible) to 1.0. The text
# and the buttons stay opaque.
opacity = 0.92

# A pinned flyout can be dragged anywhere. With false it comes back to the
# place above the next time it shows; with true the place it was dragged to
# is written above (monitor, anchor and offsets) and used from then on.
remember_drag = false

[timing]
# In milliseconds. The flyout fades in, stays for `hold_ms` after the last
# volume change or track change, then fades out. 0 fades at once.
fade_in_ms = 150
hold_ms = 3000
fade_out_ms = 400
